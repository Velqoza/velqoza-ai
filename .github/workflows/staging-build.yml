name: VELQOZA AI staging build
on:
  push:
    branches: [staging-production-prep]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
      - name: Run unit tests
        run: npm --workspace server run test
      - name: Build client and server
        run: npm run build
      - name: Check generated outputs
        run: test -f client/dist/index.html && test -f server/dist/index.js
