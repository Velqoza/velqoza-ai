name: VELQOZA AI staging build
on:
  push:
    branches: [staging-production-prep]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm --workspace server run test
      - name: Build client and server
        run: npm run build
      - name: Check generated outputs
        run: test -f client/dist/index.html && test -f server/dist/index.js
      - name: Commit verified npm lockfile to staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging-production-prep'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json
            git commit -m "chore: sync npm lockfile with PostgreSQL dependencies"
            git push origin HEAD:staging-production-prep
          fi
